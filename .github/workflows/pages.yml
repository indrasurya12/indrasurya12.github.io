name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A13C3B: ${{ secrets.A13C3B }}
          BFA692: ${{ secrets.BFA692 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A13C3B', '')
          tag_b = os.environ.get('BFA692', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- a4a8f46147164f8ff4f57f050c0b38846f6190e1dc0907 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- b839219303e28874275b0c4199633806a8763b23a87fa8b1 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
